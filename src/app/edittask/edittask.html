<div class="container mt-5">
    <div class="card shadow-sm">
        <div class="card-body">
            <h4 class="mb-4">Edit Task</h4>

            <form>
                <div class="mb-3">
                    <label class="form-label">Task Title</label>
                    <input type="text" class="form-control" placeholder="Enter task title">
                </div>

                <div class="mb-3">
                    <label class="form-label">Details</label>
                    <textarea class="form-control" rows="4" placeholder="Enter details..."></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Status</label>
                    <select class="form-select">
                        <option>Active</option>
                        <option>Inactive</option>
                    </select>
                </div>

                <button class="btn btn-success m-3">Update Task</button>
                <a href="/showallnotes" class="btn btn-secondary">Back</a>
            </form>
        </div>
    </div>
</div>
